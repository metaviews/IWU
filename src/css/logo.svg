<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="28%" r="22%">
      <stop offset="0%" stop-color="#c4a35a" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#c4a35a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#c4a35a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="60" cy="60" r="56" fill="#141414" stroke="#c4a35a" stroke-width="1.5"/>

  <!-- Soft glow above the leaf tip -->
  <circle cx="60" cy="30" r="9" fill="url(#glow)"/>

  <!-- Single leaf - split down the middle -->
  <!-- Left half (organic) - smooth curves, natural -->
  <path d="M60 24 
           C56 28, 46 40, 38 52 
           C32 62, 28 70, 30 76 
           C32 82, 38 86, 44 86 
           C50 86, 56 84, 58 80 
           L60 24Z" 
        fill="#c4a35a" opacity="0.8"/>
  
  <!-- Left half vein -->
  <path d="M60 28 C56 36, 48 50, 42 64 C38 72, 38 78, 42 82" 
        stroke="#141414" stroke-width="0.5" opacity="0.12" fill="none"/>

  <!-- Right half (digital) - angular, geometric -->
  <path d="M60 24 
           L64 32 L72 44 
           L82 58 C86 66, 88 72, 86 78 
           C84 84, 78 86, 72 86 
           C66 86, 62 84, 60 80 
           L60 24Z" 
        fill="#c4a35a" opacity="0.8"/>
  
  <!-- Right half circuit traces -->
  <path d="M74 46 L78 42 L82 42" stroke="#0a0a0a" stroke-width="0.6" opacity="0.3" fill="none"/>
  <circle cx="82" cy="42" r="0.9" fill="#0a0a0a" opacity="0.3"/>
  <path d="M76 50 L80 46" stroke="#0a0a0a" stroke-width="0.5" opacity="0.25" fill="none"/>
  <path d="M78 54 L82 50" stroke="#0a0a0a" stroke-width="0.5" opacity="0.25" fill="none"/>

  <!-- Center line where the halves meet -->
  <line x1="60" y1="24" x2="60" y2="80" stroke="#141414" stroke-width="0.8" opacity="0.2"/>

  <!-- Small spark at the tip -->
  <circle cx="60" cy="24" r="1.2" fill="#c4a35a" opacity="0.6"/>

  <text x="60" y="106" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="bold" fill="#c4a35a" letter-spacing="3" opacity="0.9">IWU</text>
</svg>
